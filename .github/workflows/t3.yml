name: T3

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker:
    name: Worker and dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # the runner's own Node.js; the tests need 22.13 or later for its built-in SQLite
      - run: node --version
      - name: The built dashboard matches its source
        run: |
          cd worker
          node build.mjs
          git diff --exit-code -- src/dashboard.js
      - name: Run the tests
        run: node worker/test/run.mjs
