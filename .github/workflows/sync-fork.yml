name: Sync Fork with Upstream (Hourly)

# Keeps this fork current with its parent repository.
# - Runs every hour, plus on demand.
# - Local content is preserved: on any conflicting change the fork's version wins (-X ours),
#   and this fork's .github/workflows files are kept as they are.
# - The sync is committed as a single squashed commit. Upstream commits are NOT imported into
#   the fork's history: the Actions token cannot push a commit that touches a workflow file,
#   and upstream's own commits do touch them. Squashing keeps that history out.
# - Delivery is via pull request which is then merged automatically (no force-push, no direct
#   write to the default branch).

on:
  schedule:
    - cron: '0 * * * *'   # hourly, on the hour
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run - build the sync commit but do not push, open a PR, or merge'
        type: boolean
        default: false
      protect_workflows:
        description: 'Keep this fork''s .github/workflows files (do not take upstream versions)'
        type: boolean
        default: true
      self_test:
        description: 'Self test - open and merge a throwaway empty PR to verify the PR + merge path'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-fork-hourly
  cancel-in-progress: false

env:
  STATE_FILE: .github/sync-state.json

jobs:
  sync:
    name: Sync fork via PR
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      UPSTREAM_REPO: ${{ vars.UPSTREAM_REPO }}
      # Scheduled runs have no inputs object; `null == false` is true in Actions expressions,
      # so the default must be spelled out as "only a dispatch can turn this off".
      PROTECT_WORKFLOWS: ${{ github.event_name == 'workflow_dispatch' && inputs.protect_workflows == false && 'false' || 'true' }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true && 'true' || 'false' }}
    steps:
      - name: Detect upstream repository
        id: upstream
        run: |
          PARENT="$UPSTREAM_REPO"
          if [ -z "$PARENT" ]; then
            PARENT=$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.parent.full_name // empty')
          fi
          if [ -z "$PARENT" ]; then
            echo "::error::This repository is not a fork (no parent). Aborting."
            exit 1
          fi
          UP_BRANCH=$(gh api "repos/${PARENT}" --jq '.default_branch')
          echo "repo=$PARENT" >> "$GITHUB_OUTPUT"
          echo "branch=$UP_BRANCH" >> "$GITHUB_OUTPUT"
          echo "Upstream: ${PARENT} @ ${UP_BRANCH}"

      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch upstream and check for new commits
        id: check
        env:
          UPSTREAM_REPO: ${{ steps.upstream.outputs.repo }}
          UPSTREAM_BRANCH: ${{ steps.upstream.outputs.branch }}
        run: |
          BASE_BRANCH=$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.default_branch')
          echo "base=$BASE_BRANCH" >> "$GITHUB_OUTPUT"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch --no-tags upstream "$UPSTREAM_BRANCH"
          git checkout -B "$BASE_BRANCH" "origin/${BASE_BRANCH}"
          echo "base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          # The last upstream commit this fork actually ingested. Without it the merge base
          # would stay at the original fork point and every run would re-apply all history.
          STATE_SHA=""
          if [ -f "$STATE_FILE" ]; then
            STATE_SHA=$(jq -r '.sha // empty' "$STATE_FILE" 2>/dev/null || true)
          fi
          if [ -n "$STATE_SHA" ] && git cat-file -e "${STATE_SHA}^{commit}" 2>/dev/null; then
            BASE_REF="$STATE_SHA"
          else
            BASE_REF="HEAD"
            STATE_SHA=""
          fi
          echo "state_sha=$STATE_SHA" >> "$GITHUB_OUTPUT"
          echo "base_ref=$BASE_REF" >> "$GITHUB_OUTPUT"

          BEHIND=$(git rev-list --count "${BASE_REF}..upstream/${UPSTREAM_BRANCH}")
          echo "behind=$BEHIND" >> "$GITHUB_OUTPUT"
          echo "Fork is behind ${UPSTREAM_REPO}/${UPSTREAM_BRANCH} by ${BEHIND} commit(s) since ${BASE_REF:0:7}."

          if [ "$BEHIND" -eq 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            git log --pretty=format:'%h %s' "${BASE_REF}..upstream/${UPSTREAM_BRANCH}" | head -100 > "${RUNNER_TEMP}/sync-commits.txt"
          fi

      - name: Build sync commit
        id: build
        if: steps.check.outputs.skip == 'false'
        env:
          UPSTREAM_BRANCH: ${{ steps.upstream.outputs.branch }}
          BASE_SHA: ${{ steps.check.outputs.base_sha }}
          BASE_BRANCH: ${{ steps.check.outputs.base }}
        run: |
          SYNC_BRANCH="sync/upstream-${GITHUB_RUN_ID}"
          echo "branch=$SYNC_BRANCH" >> "$GITHUB_OUTPUT"
          git checkout -b "$SYNC_BRANCH"

          NEW_SHA=$(git rev-parse "upstream/${UPSTREAM_BRANCH}")
          echo "upstream_sha=$NEW_SHA" >> "$GITHUB_OUTPUT"

          # Squash-merge: content comes across, upstream commits do not. "-X ours" keeps this
          # fork's content wherever upstream changed the same hunk.
          if ! git merge --squash -X ours "upstream/${UPSTREAM_BRANCH}"; then
            echo "::error::Squash merge failed unexpectedly (conflicts should resolve to ours)."
            git reset --hard >/dev/null
            exit 1
          fi

          # Restore this fork's workflow files, which are deliberately not synced.
          if [ "$PROTECT_WORKFLOWS" = "true" ]; then
            git rm -r -f --ignore-unmatch .github/workflows >/dev/null
            if git cat-file -e "${BASE_SHA}:.github/workflows" 2>/dev/null; then
              git checkout "$BASE_SHA" -- .github/workflows
            fi
            git add -A .github
          fi

          # Record how far upstream we have come, so the next run only looks at new commits.
          mkdir -p "$(dirname "$STATE_FILE")"
          jq -n --arg upstream "${{ steps.upstream.outputs.repo }}" \
                --arg branch "$UPSTREAM_BRANCH" \
                --arg sha "$NEW_SHA" \
                --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                '{upstream:$upstream, branch:$branch, sha:$sha, synced_at:$at}' > "$STATE_FILE"
          git add -A

          # Guard: the Actions token cannot push a commit that modifies a workflow file.
          # Anything still touching .github/workflows here would fail the push with a
          # confusing "refusing to allow a GitHub App to create or update workflow" error.
          WORKFLOW_CHANGES=$(git diff --cached --name-only | grep -E '^\.github/workflows/' || true)
          if [ -n "$WORKFLOW_CHANGES" ]; then
            echo "::error::Staged changes touch .github/workflows; the workflow token cannot push these:"
            echo "$WORKFLOW_CHANGES"
            exit 1
          fi

          COMMIT_COUNT=$(wc -l < "${RUNNER_TEMP}/sync-commits.txt" | tr -d ' ')
          git commit -q -m "chore(sync): upstream ${NEW_SHA:0:7} (${COMMIT_COUNT} commits)" \
            -m "Squashed sync of ${{ steps.upstream.outputs.repo }}@${UPSTREAM_BRANCH} at ${NEW_SHA}." \
            -m "Local content preserved (-X ours); .github/workflows kept from this fork."

          CHANGED=$(git diff --name-only "origin/${BASE_BRANCH}...HEAD" | wc -l | tr -d ' ')
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "Files differing from fork ${BASE_BRANCH}: ${CHANGED}"
          git show --stat --oneline HEAD | head -40

      - name: Push sync branch
        id: push
        if: steps.check.outputs.skip == 'false' && steps.build.outputs.changed != '0' && env.DRY_RUN != 'true'
        run: |
          git push origin "${{ steps.build.outputs.branch }}"

      - name: Open pull request
        id: pr
        if: steps.check.outputs.skip == 'false' && steps.build.outputs.changed != '0' && env.DRY_RUN != 'true'
        env:
          BASE_BRANCH: ${{ steps.check.outputs.base }}
          SYNC_BRANCH: ${{ steps.build.outputs.branch }}
          UPSTREAM_REPO: ${{ steps.upstream.outputs.repo }}
          UPSTREAM_BRANCH: ${{ steps.upstream.outputs.branch }}
          UPSTREAM_SHA: ${{ steps.build.outputs.upstream_sha }}
        run: |
          COMMITS=$(sed 's/^/- /' "${RUNNER_TEMP}/sync-commits.txt" 2>/dev/null | head -50)
          {
            echo "Hourly sync of \`${UPSTREAM_REPO}/${UPSTREAM_BRANCH}\` into this fork."
            echo ""
            echo "Local content is preserved: conflicting changes keep the fork's version,"
            echo "and this fork's \`.github/workflows/\` files are kept as they are."
            echo ""
            echo "The sync is a single squashed commit. Upstream commits are not imported into"
            echo "this fork's history — the Actions token cannot push a commit that touches a"
            echo "workflow file, and upstream's own commits do."
            echo ""
            echo "Upstream HEAD: \`${UPSTREAM_SHA}\`"
            echo ""
            echo "### Upstream commits ingested"
            echo ""
            echo "${COMMITS:-_none listed_}"
            echo ""
            echo "_Opened by \`.github/workflows/sync-fork.yml\` and merged automatically._"
          } > "${RUNNER_TEMP}/pr-body.md"

          # REST, not `gh pr create`: the Actions token is refused on the GraphQL
          # createPullRequest mutation but is permitted on POST /repos/{owner}/{repo}/pulls.
          set +e
          RESP=$(gh api -X POST "repos/${GITHUB_REPOSITORY}/pulls" \
            -f title="chore(sync): upstream ${UPSTREAM_SHA:0:7} $(date -u '+%Y-%m-%d %H:%M') UTC" \
            -f head="$SYNC_BRANCH" \
            -f base="$BASE_BRANCH" \
            -f body="$(cat "${RUNNER_TEMP}/pr-body.md")" 2>&1)
          RC=$?
          set -e
          if [ "$RC" -ne 0 ]; then
            echo "::error::Could not open pull request: ${RESP}"
            exit 1
          fi
          URL=$(echo "$RESP" | jq -r '.html_url')
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Opened PR: $URL"

      - name: Merge pull request
        if: steps.pr.outputs.url != ''
        env:
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          for attempt in 1 2 3 4 5; do
            if gh pr merge "$PR_URL" --merge --delete-branch; then
              echo "Merged ${PR_URL}"
              exit 0
            fi
            echo "Merge attempt ${attempt} failed; retrying in 15s..."
            sleep 15
          done
          echo "::error::Could not merge ${PR_URL} after 5 attempts."
          exit 1

      - name: Self test - verify PR and merge path
        id: selftest
        if: inputs.self_test == true
        env:
          BASE_BRANCH: ${{ steps.check.outputs.base }}
        run: |
          TEST_BRANCH="sync/selftest-${GITHUB_RUN_ID}"
          git checkout -B "$TEST_BRANCH" "origin/${BASE_BRANCH}"
          git commit --allow-empty -m "chore(sync): pipeline self-test (empty commit)"
          git push origin "$TEST_BRANCH"
          set +e
          RESP=$(gh api -X POST "repos/${GITHUB_REPOSITORY}/pulls" \
            -f title="chore(sync): pipeline self-test ${GITHUB_RUN_ID}" \
            -f head="$TEST_BRANCH" \
            -f base="$BASE_BRANCH" \
            -f body="Empty commit from the sync workflow self-test." 2>&1)
          RC=$?
          set -e
          if [ "$RC" -ne 0 ]; then
            echo "::error::Pull request creation denied: ${RESP}"
            exit 1
          fi
          URL=$(echo "$RESP" | jq -r '.html_url')
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Self-test PR: $URL"
          for attempt in 1 2 3 4 5; do
            if gh pr merge "$URL" --merge --delete-branch; then
              echo "Self-test merge OK"
              exit 0
            fi
            echo "Merge attempt ${attempt} failed; retrying in 15s..."
            sleep 15
          done
          echo "::error::Self-test could not merge ${URL}."
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "## Sync Fork with Upstream (Hourly)"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Fork | \`${GITHUB_REPOSITORY}\` |"
            echo "| Upstream | \`${{ steps.upstream.outputs.repo }}\` |"
            echo "| Branch | \`${{ steps.check.outputs.base }}\` |"
            echo "| Triggered by | \`${GITHUB_EVENT_NAME}\` |"
            echo "| Behind by | ${{ steps.check.outputs.behind }} commit(s) |"
            echo "| Changed files | ${{ steps.build.outputs.changed }} |"
            echo "| PR | ${{ steps.pr.outputs.url || '—' }} |"
            echo "| Self test | ${{ inputs.self_test == true && format('Yes — {0}', steps.selftest.outputs.url) || 'No' }} |"
            echo "| Dry run | ${DRY_RUN} |"
            echo "| Protect workflows | ${PROTECT_WORKFLOWS} |"
            echo "| Run at | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |"
            echo ""
            if [ "${{ steps.check.outputs.skip }}" = "true" ]; then
              echo "_Already up to date — nothing to sync._"
            elif [ "${{ steps.build.outputs.changed }}" = "0" ]; then
              echo "_Upstream commits carried no content changes for this fork._"
            elif [ "${DRY_RUN}" = "true" ]; then
              echo "_Dry run — sync commit built but not pushed._"
            else
              echo "_Sync delivered via pull request and merged._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
